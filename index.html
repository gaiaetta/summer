<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Spese Shopping - Summer 🛍️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-3xl mx-auto text-slate-800">

  <div id="pdf-content" class="bg-white p-6 md:p-8 rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 mb-6">
    
    <div class="border-b-2 border-slate-100 pb-5 mb-6">
      <div class="flex justify-between items-start mb-2">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Report Spese Shopping 🛍️</h1>
          <p class="text-xs text-slate-400 font-medium">Rendiconto dettagliato della giornata</p>
        </div>
        <span class="bg-pink-50 text-pink-600 font-bold px-3 py-1.5 rounded-xl text-xs border border-pink-100">
          Budget: 220,00 €
        </span>
      </div>
      
      <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl border border-slate-100 mt-4">
        <div><span class="text-slate-400">Ragazza:</span> <strong>Summer</strong></div>
        <div><span class="text-slate-400">Data:</span> <strong id="current-date"></strong></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-pink-50 p-4 rounded-2xl border border-pink-100">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs uppercase tracking-wider text-pink-700 font-bold">Shopping 👗</span>
          <span class="text-[10px] bg-pink-200/60 text-pink-800 px-1.5 py-0.5 rounded-md font-semibold">Budget: 200 €</span>
        </div>
        <div class="text-2xl font-black text-pink-900" id="shop-spent">0,00 €</div>
        <div class="text-xs text-pink-600 font-medium mt-1">Rimanenti: <span id="shop-remaining">200,00 €</span></div>
      </div>

      <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs uppercase tracking-wider text-amber-700 font-bold">Pranzo 🍕</span>
          <span class="text-[10px] bg-amber-200/60 text-amber-800 px-1.5 py-0.5 rounded-md font-semibold">Budget: 20 €</span>
        </div>
        <div class="text-2xl font-black text-amber-900" id="food-spent">0,00 €</div>
        <div class="text-xs text-amber-600 font-medium mt-1">Rimanenti: <span id="food-remaining">20,00 €</span></div>
      </div>
    </div>

    <div class="mb-6">
      <h2 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider flex justify-between items-center">
        Dettaglio Acquisti e Luoghi
        <span class="text-xs font-normal text-slate-400 capitalize" id="item-count">0 acquisti</span>
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-[11px] font-
